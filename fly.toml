app = "faceit"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  MIN_LOBBY_PLAYERS = "10"
  DB_PATH = "/data"

[mounts]
  source = "bot_data"
  destination = "/data"

[processes]
  app = "./bot"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true

  [[services.ports]]
    port = 8080

  [[services.http_checks]]
    interval = 30000
    timeout = 5000
    path = "/"
